[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "congen2"
dynamic = ["version"]
description = "A faithful Python/pyglet port of Congeneration 2"
requires-python = ">=3.11"
dependencies = ["pyglet>=2.1"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["congen2"]

[tool.setuptools.dynamic]
version = { attr = "congen2.__version__" }

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
congen2 = "congen2.app:main"
